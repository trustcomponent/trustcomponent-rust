[package]
name = "trustcomponent"
version = "0.0.1-beta.2"
description = "Official TrustComponent SDK for Rust: TrustCaptcha, TrustAnalytics, TrustMonitoring, Trust VAT Checker and the platform API."
authors = ["Trustcaptcha GmbH <mail@trustcomponent.com>"]
license = "MIT"
homepage = "https://docs.trustcomponent.com"
repository = "https://github.com/trustcomponent/trustcomponent-rust"
readme = "README.md"
keywords = ["trustcomponent", "trustcaptcha", "captcha", "analytics", "monitoring"]
edition = "2021"
# Listed explicitly: the generated code is git-ignored here and would otherwise be left out of the crate.
include = ["src/**/*.rs", "examples/**/*.rs", "Cargo.toml", "README.md", "LICENSE.md"]
rust-version = "1.80"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_with = { version = "3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "1.0"
serde_repr = "0.1"
url = "2.5"
uuid = { version = "1.8", features = ["serde", "v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "form"] }
reqwest-middleware = { version = "0.5", features = ["json", "multipart", "query", "form"] }
async-trait = "0.1"
http = "1"
base64 = "0.22"
rand = "0.9"
httpdate = "1"
tokio = { version = "1", features = ["time"] }
regex = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[features]
default = ["rustls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
